---
title: デバッガ―開発入門
language: ja
audience: 学部3年生くらいで、プログラミング言語処理系初心者
notes: |-
  言語処理系を作ると、その言語のためのデバッガを作ることができます。
  ただ、デバッガを作るといっても、そもそもどんなものであるかわからないとなかなか難しい。
  そこで、「デバッガ―とは何か、どういう機能があるのか、どういうデバッガがあるのか」
  「それをどう作るのか」を、簡単な言語処理系を例にして解説する本を作ってください。

    注意:
    * 未使用用語は説明する
    * 例だけの (sub)section は作らない。ちゃんと説明する
    * コードを出すだけの (sub)section は作らない。ちゃんと説明する
    * 参考文献は積極的に引用する
    * 言語処理系のプログラムの例を出すときはなるべく Ruby を使う
